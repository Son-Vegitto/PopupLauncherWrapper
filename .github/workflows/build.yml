name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
          cache-disabled: true

      - name: Build Unsigned Release APK
        run: gradle assembleRelease

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/release.keystore \
            -alias mykeyalias \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass mypassword \
            -keypass mypassword \
            -dname "CN=PopupLauncher, OU=Dev, O=Self, L=City, S=State, C=US"

      - name: Align and Sign APK
        run: |
          # Locate build tools directory dynamically
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          
          # Paths for raw build and final output
          INPUT_APK=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          ALIGNED_APK="app/build/outputs/apk/release/PopupLauncher-aligned.apk"
          FINAL_APK="app/build/outputs/apk/release/PopupLauncher-Signed.apk"
          
          # Zipalign the APK first (required before signing)
          $BUILD_TOOLS/zipalign -v 4 "$INPUT_APK" "$ALIGNED_APK"
          
          # Sign using apksigner with the generated keystore
          $BUILD_TOOLS/apksigner sign --ks app/release.keystore \
            --ks-pass pass:mypassword \
            --ks-key-alias mykeyalias \
            --key-pass pass:mypassword \
            --out "$FINAL_APK" \
            "$ALIGNED_APK"

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: PopupLauncher-Signed-APK
          path: app/build/outputs/apk/release/PopupLauncher-Signed.apk
          
